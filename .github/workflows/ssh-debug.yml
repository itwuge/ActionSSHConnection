name: SSH 调试会话

# 触发入口：
#   1) workflow_dispatch：ssh 布尔开关为 true
#   2) repository_dispatch：event_type 为 ssh（调用方需有 contents:write 权限）
#
# 必需仓库变量：
#   UPTERM_RELAY_KNOWN_HOST = 中转主机 known_hosts 行（公钥，非私钥）
#
# 凭据底线：
#   - 日志与摘要只写路由字段（中转地址、端口、会话标识、SSH 用户名、公钥指纹、到期时间）
#   - 不对连接信息加 ::add-mask::，路由字段不取自 secrets
#   - 不开启 limit-access-to-actor、full-access、allow-exec、allow-forwarding

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "建立 SSH 调试会话"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [ssh]

permissions:
  contents: read

jobs:
  session:
    name: ssh-session
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.ssh == true) ||
      github.event_name == 'repository_dispatch'
    env:
      UPTERM_SERVER: ssh://relay.wuge.fun:22
      UPTERM_AUTHORIZED_USERS: itwuge
      UPTERM_DISPATCHER: itwuge
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: 校验触发来源与仓库变量
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SENDER: ${{ github.event.sender.login }}
          KNOWN_HOST: ${{ vars.UPTERM_RELAY_KNOWN_HOST }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "$DISPATCH_SENDER" != "$UPTERM_DISPATCHER" ]; then
              echo "拒绝：repository_dispatch 发起者不是 $UPTERM_DISPATCHER" >&2
              exit 1
            fi
          fi
          if [ -z "$KNOWN_HOST" ]; then
            echo "缺少仓库变量 UPTERM_RELAY_KNOWN_HOST（中转主机 known_hosts 行）" >&2
            exit 1
          fi

      - name: 记录路由信息
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## SSH 调试会话路由信息"
            echo ""
            echo "| 字段 | 值 |"
            echo "| --- | --- |"
            echo "| 中转地址 | $UPTERM_SERVER |"
            echo "| 授权 GitHub 用户 | $UPTERM_AUTHORIZED_USERS |"
            echo "| 无人接入超时 | 10 分钟 |"
            echo "| 最迟结束（作业级 45 分钟上限） | $(date -u -d '+45 minutes' '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "授权公钥指纹："
          } >> "$GITHUB_STEP_SUMMARY"

          for user in ${UPTERM_AUTHORIZED_USERS//,/ }; do
            gh api "users/$user/keys" --paginate --jq '.[].key' |
            while IFS= read -r key; do
              [ -n "$key" ] || continue
              fp="$(printf '%s\n' "$key" | ssh-keygen -lf /dev/stdin | awk '{print $2}')"
              echo "- $user $fp" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: 建立 SSH 调试会话
        id: upterm
        uses: owenthereal/action-upterm@6c2d60e09009f59cb4c45c88767c78701f14d121 # v2.8.1
        timeout-minutes: 40
        with:
          upterm-server: ssh://relay.wuge.fun:22
          limit-access-to-users: itwuge
          wait-timeout-minutes: 10
          upterm-version: v0.41.1
          known-hosts: ${{ vars.UPTERM_RELAY_KNOWN_HOST }}

name: 调试会话

# 依据：.team/specs/项目设计书-20261109-v3.md（v3）
# 本文件属入口层（G01），不含部署逻辑。
#
# 两条触发入口共用同一会话创建逻辑（同一 job、同一组步骤），不各写一份：
#   1) workflow_dispatch：布尔输入 start_session，默认 false
#   2) repository_dispatch：event_type 固定 start-session，client_payload.keyword 固定 start-session
#
# 客户端：自建步骤调用 upterm 客户端（不走任何封装 action）。
#   - 客户端原始输出（含 ticket 的连接串）只写入文件，stdout/stderr 一律重定向丢弃；
#   - 日志与摘要只按白名单输出 9 项：relay_host / port / session_id / ssh_user /
#     pubkey_fingerprint / expires_at / web_url / pubkey_credential_id / path_mode；
#   - session_id 只取连接串用户名部分冒号前的片段，ticket 不进任何载体。
#
# 必需仓库变量（均为非秘密路由信息）：
#   UPTERM_RELAY_KNOWN_HOST   中继主机 known_hosts 行（公钥，防中间人）
#   WEB_TERMINAL_BASE_URL     网页终端静态页地址（不含会话参数）
#   WEBAUTHN_CREDENTIAL_ID    公钥凭据标识（WebAuthn credential id，公开标识）
# 可选仓库变量：
#   UPTERM_DIRECT_ENDPOINT    直连候选对端 host[:port]；不配即按「无可用对端地址」判直连失败

on:
  workflow_dispatch:
    inputs:
      start_session:
        description: "建立调试会话"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [start-session]

permissions:
  contents: read

env:
  RELAY_HOST: relay.wuge.fun
  RELAY_PORT: "22"
  SSH_USER: itwuge
  SESSION_NAME: actssh
  JOB_TIMEOUT_MINUTES: "45"
  JOIN_TIMEOUT: 10m
  UPTERM_VERSION: v0.41.1
  UPTERM_ASSET: upterm_linux_amd64.tar.gz
  UPTERM_SHA256: 3007d4ce09e9f70a390e1b52e5a0b591fc9fa473196ca76d8f72b5f1cd723b31
  WORKDIR: ${{ runner.temp }}/actssh
  WEB_TERMINAL_BASE_URL: ${{ vars.WEB_TERMINAL_BASE_URL }}
  WEBAUTHN_CREDENTIAL_ID: ${{ vars.WEBAUTHN_CREDENTIAL_ID }}
  UPTERM_DIRECT_ENDPOINT: ${{ vars.UPTERM_DIRECT_ENDPOINT }}

jobs:
  session:
    name: debug-session
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.start_session == true) ||
      github.event_name == 'repository_dispatch'
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: 校验入口与前置配置
        id: precheck
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SENDER: ${{ github.event.sender.login }}
          DISPATCH_KEYWORD: ${{ github.event.client_payload.keyword || '' }}
          KNOWN_HOST: ${{ vars.UPTERM_RELAY_KNOWN_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ "${DISPATCH_KEYWORD:-}" != "start-session" ]; then
              echo "失败[阶段 precheck]：client_payload.keyword 必须为 start-session" >&2
              exit 1
            fi
            if [ "$DISPATCH_SENDER" != "$SSH_USER" ]; then
              echo "失败[阶段 precheck]：repository_dispatch 发起者不是 $SSH_USER" >&2
              exit 1
            fi
          fi

          missing=""
          [ -n "${KNOWN_HOST:-}" ] || missing="$missing UPTERM_RELAY_KNOWN_HOST"
          [ -n "${WEB_TERMINAL_BASE_URL:-}" ] || missing="$missing WEB_TERMINAL_BASE_URL"
          [ -n "${WEBAUTHN_CREDENTIAL_ID:-}" ] || missing="$missing WEBAUTHN_CREDENTIAL_ID"
          if [ -n "$missing" ]; then
            echo "失败[阶段 precheck]：缺少仓库变量$missing" >&2
            exit 1
          fi

          install -m 700 -d "$WORKDIR"

          # 中继主机公钥只用于防中间人，不作为授权依据
          printf '%s\n' "$KNOWN_HOST" > "$WORKDIR/known_hosts"

          # runner 侧访客公钥闸门：只放行该 GitHub 用户登记的公钥
          gh api "users/$SSH_USER/keys" --paginate --jq '.[].key' > "$WORKDIR/authorized_keys" || {
            echo "失败[阶段 fetch-keys]：取不到 $SSH_USER 的公钥" >&2
            exit 1
          }
          if [ ! -s "$WORKDIR/authorized_keys" ]; then
            echo "失败[阶段 fetch-keys]：$SSH_USER 未登记 SSH 公钥" >&2
            exit 1
          fi

          fingerprints=""
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            fp="$(printf '%s\n' "$key" | ssh-keygen -lf /dev/stdin 2>/dev/null | awk '{print $2}')"
            [ -n "$fp" ] || continue
            fingerprints="${fingerprints:+$fingerprints,}$fp"
          done < "$WORKDIR/authorized_keys"
          if [ -z "$fingerprints" ]; then
            echo "失败[阶段 fetch-keys]：公钥指纹计算失败" >&2
            exit 1
          fi

          # 到期时间按作业超时上限推算，误差为前置步骤耗时（数秒）
          expires_at="$(date -u -d "@$(( $(date +%s) + JOB_TIMEOUT_MINUTES * 60 ))" '+%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "fingerprints=$fingerprints"
            echo "expires_at=$expires_at"
          } >> "$GITHUB_OUTPUT"

      - name: 判定连接路径
        id: path
        timeout-minutes: 1
        run: |
          set -euo pipefail

          # 阶段一：打洞。托管 runner 无入站端口，通常无可用对端地址，按判失败条件①直接回落中继。
          # 配置了候选地址时只做 5 秒 TCP 可达性探针；数据面是否真的直连 [待真机确认]。
          mode=relay
          if [ -n "${UPTERM_DIRECT_ENDPOINT:-}" ]; then
            host="${UPTERM_DIRECT_ENDPOINT%%:*}"
            port="22"
            case "$UPTERM_DIRECT_ENDPOINT" in *:*) port="${UPTERM_DIRECT_ENDPOINT##*:}" ;; esac
            if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
              mode=direct
            fi
          fi

          if [ "$mode" = "direct" ]; then
            echo "直连已建立（直连）"
            echo "::warning::直连判定为 TCP 可达性探针，数据面直连未验证"
          else
            echo "直连未建立，已切换到中继转发"
          fi
          echo "path_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 安装 upterm 客户端
        timeout-minutes: 5
        run: |
          set -euo pipefail

          url="https://github.com/owenthereal/upterm/releases/download/${UPTERM_VERSION}/${UPTERM_ASSET}"
          if ! curl -fsSL --retry 2 --max-time 120 -o "$WORKDIR/upterm.tar.gz" "$url"; then
            echo "失败[阶段 install-client]：下载 $UPTERM_ASSET 失败" >&2
            exit 1
          fi

          actual="$(sha256sum "$WORKDIR/upterm.tar.gz" | awk '{print $1}')"
          if [ "$actual" != "$UPTERM_SHA256" ]; then
            echo "失败[阶段 install-client]：校验和不匹配（$UPTERM_VERSION）" >&2
            exit 1
          fi

          mkdir -p "$WORKDIR/bin"
          tar -xzf "$WORKDIR/upterm.tar.gz" -C "$WORKDIR/bin" upterm || {
            echo "失败[阶段 install-client]：解包失败" >&2
            exit 1
          }
          chmod 700 "$WORKDIR/bin/upterm"
          "$WORKDIR/bin/upterm" version >/dev/null 2>&1 || {
            echo "失败[阶段 install-client]：客户端无法执行" >&2
            exit 1
          }
          echo "$WORKDIR/bin" >> "$GITHUB_PATH"

      - name: 启动会话
        timeout-minutes: 3
        run: |
          set -euo pipefail

          # 客户端原始输出只落文件；stdout/stderr 全部重定向，绝不打印。
          if ! upterm host \
              --accept \
              --detach \
              --name "$SESSION_NAME" \
              --server "ssh://${RELAY_HOST}:${RELAY_PORT}" \
              --known-hosts "$WORKDIR/known_hosts" \
              --authorized-keys "$WORKDIR/authorized_keys" \
              --join-timeout "$JOIN_TIMEOUT" \
              --no-sftp \
              --pty-size 80x24 \
              -o json > "$WORKDIR/session.json" 2> "$WORKDIR/session.err"; then
            echo "失败[阶段 start-session]：客户端异常退出，原因见运行报告，具体输出不外显" >&2
            exit 1
          fi

          if command -v jq >/dev/null 2>&1; then
            ssh_command="$(jq -r '.sshCommand // .ssh_command // empty' "$WORKDIR/session.json" 2>/dev/null || true)"
          else
            ssh_command="$(tr -d '\n' < "$WORKDIR/session.json" | sed -n 's/.*"sshCommand"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          fi
          if [ -z "${ssh_command:-}" ]; then
            echo "失败[阶段 linking]：未取得可接入的连接串，会话未完成注册" >&2
            exit 1
          fi

          # 连接串只留在文件内，供下一步解析；不落日志
          printf '%s' "$ssh_command" > "$WORKDIR/conn"
          rm -f "$WORKDIR/session.json" "$WORKDIR/session.err"

          # 会话存在性复核：只取退出码，不读输出
          if ! upterm session info "$SESSION_NAME" >/dev/null 2>&1; then
            echo "失败[阶段 linking]：会话未在中继登记" >&2
            exit 1
          fi

      - name: 准备共享终端
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # 网页终端需要一个与 SSH 会话同一路由、可被桥接进程接入的终端。
          # 这里提供可 attach 的终端进程；桥接如何接入同一 socket [待真机确认]。
          name="actssh"
          if command -v tmux >/dev/null 2>&1; then
            tmux new-session -d -s "$name" 2>/dev/null || true
            echo "共享终端就绪：tmux 会话 $name（网页桥接待 P07/P08 接入）"
          else
            echo "::warning::未找到 tmux，共享终端未就绪；网页入口 [待真机确认]"
          fi

      - name: 输出路由字段
        id: route
        timeout-minutes: 2
        env:
          EXPIRES_AT: ${{ steps.precheck.outputs.expires_at }}
          FINGERPRINTS: ${{ steps.precheck.outputs.fingerprints }}
          PATH_MODE: ${{ steps.path.outputs.path_mode }}
        run: |
          set -euo pipefail

          if [ ! -s "$WORKDIR/conn" ]; then
            echo "失败[阶段 parse-connection]：连接串文件为空" >&2
            exit 1
          fi

          conn="$(cat "$WORKDIR/conn")"
          case "$conn" in
            ssh\ *@*) : ;;
            *)
              echo "失败[阶段 parse-connection]：连接串格式不符合预期" >&2
              exit 1
              ;;
          esac
          user_part="${conn#* }"       # 去掉前缀命令（ssh）
          user_part="${user_part%%@*}" # 取 @ 前的用户名部分
          session_id="${user_part%%:*}" # 只取冒号前片段，ticket 丢弃

          if [ -z "$session_id" ]; then
            echo "失败[阶段 parse-connection]：无法解析会话标识" >&2
            exit 1
          fi
          case "$session_id" in
            *[!A-Za-z0-9._-]*)
              echo "失败[阶段 parse-connection]：会话标识含非法字符" >&2
              exit 1
              ;;
          esac

          fields="$WORKDIR/fields"
          {
            echo "relay_host=$RELAY_HOST"
            echo "port=$RELAY_PORT"
            echo "session_id=$session_id"
            echo "ssh_user=$SSH_USER"
            echo "pubkey_fingerprint=$FINGERPRINTS"
            echo "expires_at=$EXPIRES_AT"
            echo "web_url=${WEB_TERMINAL_BASE_URL}#session_id=${session_id}"
            echo "pubkey_credential_id=$WEBAUTHN_CREDENTIAL_ID"
            echo "path_mode=$PATH_MODE"
          } > "$fields"

          cat "$fields"
          {
            echo '```text'
            cat "$fields"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$fields" "$WORKDIR/conn"

      - name: 等待会话结束
        timeout-minutes: 35
        run: |
          set -euo pipefail

          # 退出钩子：先停会话（进程退出即会话消失），再清临时文件
          cleanup() {
            upterm session stop "$SESSION_NAME" >/dev/null 2>&1 || true
            if [ -n "${WORKDIR:-}" ]; then rm -rf -- "$WORKDIR"; fi
          }
          trap cleanup EXIT INT TERM

          # 无人接入 10 分钟后会话自行结束；有访客接入则持续到会话退出。
          set +e
          upterm session wait "$SESSION_NAME" >/dev/null 2>&1
          rc=$?
          set -e

          # 会话已消失即视为正常收尾；仍存在说明未正常结束
          if upterm session info "$SESSION_NAME" >/dev/null 2>&1; then
            echo "失败[阶段 session-wait]：等待返回 $rc，但会话仍存在" >&2
            exit 1
          fi
          echo "会话已结束（客户端返回码 $rc）"

      - name: 收尾清理
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          upterm session stop "$SESSION_NAME" >/dev/null 2>&1 || true
          if upterm session info "$SESSION_NAME" >/dev/null 2>&1; then
            pkill -f "upterm host" >/dev/null 2>&1 || true
          fi
          tmux kill-session -t actssh >/dev/null 2>&1 || true
          rm -rf "$WORKDIR"
          echo "会话进程与临时文件已清理"

name: 调试会话

# 依据：.team/specs/项目设计书-20261109-v3.md（v3）
# 本文件只是入口层薄封装：全部会话逻辑在同仓库根目录的 action.yml（Composite Action），
# 步骤脚本在 scripts/action/ 下，与 examples/ 和可复用工作流共用同一份实现，不重复维护。
#
# 两条触发入口共用同一 job：
#   1) workflow_dispatch：布尔输入 start_session，默认 false
#   2) repository_dispatch：event_type 固定 start-session，client_payload.keyword 固定 start-session
#
# 必需仓库变量（均为非秘密路由信息）：
#   UPTERM_RELAY_KNOWN_HOST       中继主机 known_hosts 行（公钥，防中间人）
#   WEB_TERMINAL_BASE_URL         网页终端站点根地址（如 https://wuge.fun，不含 /t/ 与任何会话参数）
#   WEBAUTHN_ALLOWED_CREDENTIALS  网页准入允许清单（单行 JSON 数组）；[] 表示开放一次自举注册
#   WEB_BRIDGE_BASE_URL           runner 反连桥接基地址（如 wss://wuge.fun，自动补 /runner）
# 可选仓库变量：
#   WEBAUTHN_CREDENTIAL_ID        公钥凭据标识；空白时路由字段输出 unset，SSH 通道不受影响
#   UPTERM_DIRECT_ENDPOINT        直连候选对端 host[:port]；不配即按「无可用对端地址」判直连失败

on:
  workflow_dispatch:
    inputs:
      start_session:
        description: "建立调试会话"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [start-session]

permissions:
  contents: read

jobs:
  session:
    name: debug-session
    runs-on: ubuntu-latest
    # 比会话上限（session-minutes=45）多留 10 分钟，保证等待、收尾都有机会执行
    timeout-minutes: 55
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.start_session == true) ||
      github.event_name == 'repository_dispatch'
    steps:
      # 调用本仓库根目录的 Action，所以必须先检出；远程调用方不需要这一步
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: 建立调试会话
        id: session
        uses: ./
        with:
          ssh: true
          relay-host: ssh.wuge.fun
          relay-port: "2222"
          ssh-user: itwuge
          session-minutes: "45"
          web-base-url: ${{ vars.WEB_TERMINAL_BASE_URL }}
          bridge-base-url: ${{ vars.WEB_BRIDGE_BASE_URL }}
          known-hosts: ${{ vars.UPTERM_RELAY_KNOWN_HOST }}
          allowed-credentials: ${{ vars.WEBAUTHN_ALLOWED_CREDENTIALS }}
          upterm-version: v0.41.1
          direct-endpoint: ${{ vars.UPTERM_DIRECT_ENDPOINT }}
          # 沿用原工作流：会话期间把 9 行路由字段另存为 route-fields 制品
          route-artifact-name: route-fields
          route-artifact-retention-days: "1"

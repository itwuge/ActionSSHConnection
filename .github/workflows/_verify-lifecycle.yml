name: 临时验证-会话生命周期

# 临时文件：仅用于本轮真机验证「会话存活期内可反复进入 + 空闲超时 + 结束后拒绝」。
# 验证完成后删除，不进入正式版本。

on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: "空闲上限分钟数"
        type: string
        required: false
        default: "1"
      session_minutes:
        description: "会话最长分钟数"
        type: string
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  session:
    name: verify-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 建立调试会话
        id: session
        uses: ./
        with:
          ssh: true
          relay-host: ssh.wuge.fun
          relay-port: "2222"
          ssh-user: itwuge
          session-minutes: ${{ inputs.session_minutes }}
          idle-minutes: ${{ inputs.idle_minutes }}
          web-base-url: ${{ vars.WEB_TERMINAL_BASE_URL }}
          bridge-base-url: ${{ vars.WEB_BRIDGE_BASE_URL }}
          known-hosts: ${{ vars.UPTERM_RELAY_KNOWN_HOST }}
          allowed-credentials: ${{ vars.WEBAUTHN_ALLOWED_CREDENTIALS }}
          credential-id: ${{ vars.WEBAUTHN_CREDENTIAL_ID }}
          upterm-version: v0.41.1
          direct-endpoint: ${{ vars.UPTERM_DIRECT_ENDPOINT }}
          route-artifact-name: route-fields
          route-artifact-retention-days: "1"

name: tmp-direct-invalidkey

# 临时验证：direct-mode=tailscale + 无效 auth key，应完成 Tailscale 安装、30 秒内失败并回落 relay。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          ssh: true
          direct-mode: tailscale
          tailscale-auth-key: ${{ secrets.TMP_TS_INVALID }}
          direct-ssh-port: "2222"
          session-minutes: "5"
          idle-minutes: "1"
          route-artifact-name: route-fields

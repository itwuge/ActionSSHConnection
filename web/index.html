<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>ActionSSHConnection</title>
    <link rel="stylesheet" href="/dist/app.css" />
  </head>
  <body>
    <main class="page">
      <section class="connect" aria-label="连接串">
        <div class="connect-row">
          <input id="connect-string" type="text" readonly spellcheck="false" aria-label="连接串" />
          <button id="copy-connect-string" type="button">复制</button>
        </div>
        <p id="status-line" class="status">未连接</p>
        <p id="message-line" class="message" role="status"></p>
      </section>

      <section class="terminal-shell" aria-label="终端">
        <div id="terminal" class="terminal"></div>

        <div id="gate" class="overlay" hidden>
          <p class="overlay-title">首次使用</p>
          <p class="overlay-text">一次注册, 之后直接进. 设备凭据只留在本机.</p>
          <div class="overlay-actions">
            <button id="gate-register" class="primary" type="button">注册本设备并进入</button>
            <button id="gate-enter" type="button">已注册过, 直接进入</button>
          </div>
        </div>

        <div id="notice" class="overlay" hidden>
          <p id="notice-text" class="overlay-text"></p>
          <button id="notice-action" type="button">重新连接</button>
        </div>
      </section>
    </main>

    <script src="/dist/app.js"></script>
  </body>
</html>

# =========** 文件头 =========**
# 文件        : ssh.wuge.fun.conf
# 所属目录    : relay/nginx/
# 文件用途    : 网页终端入口的 nginx 站点片段, 把 wss://ssh.wuge.fun 反代到宿主 uptermd 的明文 WS
# 架构定位    : 反代配置资产; 只落仓库, 不随安装脚本部署, 由运维按下方步骤复制到既有 nginx 并 reload
# 依赖        : 现有 nginx 容器(镜像 certbot-nginx, nginx 1.24.0), 其 conf.d 由宿主 bind mount 到 /root/certbot-nginx/nginx/conf/conf.d
# 端口        : 80 只做 ACME HTTP-01 与 301; 443 复用现有入口, 不新增安全组端口
# 上游        : http://172.17.0.1:8443 (docker0 网关; 容器内 127.0.0.1 指容器自身, 宿主回环也不可达,
#               因此 uptermd 必须监听 docker0 网关: 安装时 --ws-addr 172.17.0.1:8443; 未改绑时本片段返回 502)
# 证书        : 独立谱系 /etc/letsencrypt/live/ssh.wuge.fun (位于容器内); 仓库不放任何证书与私钥
#
# 部署步骤
#   1. DNS: 增加 A 记录 ssh.wuge.fun -> <中转机公网 IP>, 确认解析生效后再签证书。
#   2. 签发独立证书(不改动现有 wuge.fun-0001, 走已开放的 80 做 HTTP-01):
#        docker exec nginx certbot certonly --webroot -w /usr/local/nginx/html -d ssh.wuge.fun
#   3. 复制本片段到现有 nginx 的 conf.d:
#        install -m 0644 ssh.wuge.fun.conf /root/certbot-nginx/nginx/conf/conf.d/ssh.wuge.fun.conf
#   4. 校验并重载:
#        docker exec nginx nginx -t && docker exec nginx nginx -s reload
#   5. 验证: curl -I https://ssh.wuge.fun/ 返回正常; 浏览器打开网页终端能建立 wss。
#
# 回滚
#   1. rm -f /root/certbot-nginx/nginx/conf/conf.d/ssh.wuge.fun.conf
#   2. docker exec nginx nginx -t && docker exec nginx nginx -s reload
#   3. 证书可保留(不影响其它站点); 需彻底清除时 docker exec nginx certbot delete --cert-name ssh.wuge.fun
#
# 约束: 不改现有 server 块, 不动 443 上其它站点, 不把证书或私钥写入仓库。
#
# =========** 配置 =========**
server {
    listen 80;
    listen [::]:80;
    server_name ssh.wuge.fun;

    # 仅用于 ACME HTTP-01, 与现有站点共用容器内 webroot
    location /.well-known/acme-challenge/ {
        root /usr/local/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ssh.wuge.fun;

    ssl_certificate     /etc/letsencrypt/live/ssh.wuge.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh.wuge.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_ssh:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://172.17.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 网页终端是长连接, 关缓冲并放宽读写超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

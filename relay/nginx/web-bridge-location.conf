# =========** 文件头 =========**
# 文件        : web-bridge-location.conf
# 所属目录    : relay/nginx/
# 文件用途    : 网页通道 /ws/ 与 /runner/ 两个 location 片段, 把浏览器与 runner 的 WS 反代到中继桥接进程
# 架构定位    : 反代配置资产; 只落仓库, 不随脚本部署, 由运维 include 进既有 wuge.fun 的 443 server 块并 reload
# 依赖        : 现有 certbot-nginx 容器; 桥接进程监听 172.17.0.1:8081 (容器内 127.0.0.1 指容器自身)
# 上游        : http://172.17.0.1:8081 (docker0 网桥; 若 nginx 与桥接同机同网络命名空间, 可改为 127.0.0.1:8081)
# 端点        : /ws/<session_id> 浏览器接入; /runner/<session_id> runner 反连注册
# 约束        : 不改 ssh.wuge.fun.conf, 不动 443 上其它站点, 不在此处做任何鉴权
#
# 部署步骤
#   1. 确认桥接已在 8081 监听: ss -Hltn 'sport = :8081'
#   2. 把本片段复制进既有 wuge.fun 443 server 块所在目录, 并在该 server 块内 include:
#        include /etc/nginx/conf.d/web-bridge-location.conf;
#      （本项目容器内路径为 /root/certbot-nginx/nginx/conf/conf.d/, 按实际 conf.d 调整）
#   3. 校验并重载:
#        docker exec nginx nginx -t && docker exec nginx nginx -s reload
#   4. 验证: 浏览器 wss://wuge.fun/ws/<session_id> 返回 101; runner 侧 wss://wuge.fun/runner/<session_id> 返回 101
#
# 回滚
#   1. 从 wuge.fun 的 443 server 块删除 include 行（或删除本文件）
#   2. docker exec nginx nginx -t && docker exec nginx nginx -s reload
#   3. systemctl disable --now actssh-web-bridge.service
#   网页入口随即不可用, SSH 入口不受影响.
#
# 说明
#   - proxy_pass 末尾不带斜杠, 保留原始 URI, 桥接按路径里的 session_id 配对.
#   - WebSocket 必须 HTTP/1.1 + Upgrade/Connection 头; 关闭缓冲, 读写超时不低于会话上限.
#   - 不在此层加 auth_request 或任何验签: 认证在 runner 侧 web_admission.py, 中继不终结认证.

location ^~ /ws/ {
    proxy_pass http://172.17.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 长连接: 禁缓冲, 放宽读写超时, 连接失败快速返回
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
}

location ^~ /runner/ {
    proxy_pass http://172.17.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # runner 反连与浏览器同构: 禁缓冲 + 长超时, 避免中转层提前断开
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
}
